name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip wget openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Cython and Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install Cython==0.29.36
          python -m pip install buildozer
          buildozer --version
          python -m pip show buildozer

      - name: Pre-install Android SDK command line tools
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/licenses"
          cd "$SDK_ROOT"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip

          unzip -q commandlinetools-linux-6514223_latest.zip

          test -x "$SDK_ROOT/tools/bin/sdkmanager"

          echo "sdkmanager found:"
          "$SDK_ROOT/tools/bin/sdkmanager" --sdk_root="$SDK_ROOT" --version

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          yes | "$SDK_ROOT/tools/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" \
            --licenses

          echo "Android SDK licenses:"
          find "$SDK_ROOT/licenses" -maxdepth 1 -type f -print 2>/dev/null || true

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jizhangben-debug-apk
          path: bin/*.apk
