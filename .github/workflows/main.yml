name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36"
          python -m pip install "buildozer==1.6.0"

          python --version
          cython --version
          buildozer --version

      - name: Pre-install Android SDK command line tools
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK_ROOT"
          cd "$SDK_ROOT"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip

          unzip -q commandlinetools-linux-6514223_latest.zip

          test -x "$SDK_ROOT/tools/bin/sdkmanager"

          echo "sdkmanager:"
          "$SDK_ROOT/tools/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          yes | "$SDK_ROOT/tools/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" \
            --licenses

          echo "SDK licenses:"
          find "$SDK_ROOT/licenses" \
            -maxdepth 1 \
            -type f \
            -print 2>/dev/null || true

      - name: Clean previous Android build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Verify Buildozer configuration
        run: |
          echo "===== buildozer.spec ====="
          cat buildozer.spec
          echo "=========================="

      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          buildozer android debug

      - name: Verify APK
        run: |
          echo "===== APK FILES ====="
          find bin -maxdepth 1 -type f -name "*.apk" -print

          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jizhangben-debug-apk
          path: bin/*.apk
          if-no-files-found: error
